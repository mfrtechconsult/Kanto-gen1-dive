name: Release launcher ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("kanto_dive/manifest.json"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build launcher-ready ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          ZIP="Kanto-Dive-${VERSION}-Launcher-Ready.zip"
          (
            cd kanto_dive
            zip -r "../$ZIP" . -x '*.DS_Store' '__MACOSX/*'
          )
          python3 - "$ZIP" <<'PY'
          import json, sys, zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              assert 'manifest.json' in names, 'manifest.json must be at ZIP root'
              assert 'main.lua' in names, 'main.lua must be at ZIP root'
              assert not any(n.lower().endswith('.zip') for n in names), 'nested ZIP found'
              manifest = json.loads(z.read('manifest.json'))
              assert manifest['version']
          print('launcher-ready ZIP verified:', path)
          PY
          sha256sum "$ZIP" > "$ZIP.sha256"

      - name: Write release notes
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          cat > release-notes.md <<EOF
          ## Kanto Dive ${VERSION}

          This maintenance release makes visible underwater Pokemon encounters behave like real overworld contact encounters.

          Highlights:
          - underwater battles now trigger only when the player actually touches the visible Pokemon sprite;
          - removed the old 2.5-cell proximity interception radius;
          - removed the extra long-range bonus previously applied to large Pokemon;
          - contact follows the displayed Pokédex-scaled sprite footprint;
          - visible species/level, Wilds-only encounter policy and post-battle cooldowns are preserved;
          - includes regression coverage for long-range non-contact, true contact and large scaled sprites.

          Everything from the Full-Kanto 1.6.0 overhaul remains included.

          The attached ZIP is ready to import directly in the Gen1Recomp launcher: \`manifest.json\` and \`main.lua\` are at the archive root.
          EOF

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          TAG='${{ steps.version.outputs.tag }}'
          ZIP="Kanto-Dive-${VERSION}-Launcher-Ready.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --clobber
            gh release edit "$TAG" --title "Kanto Dive ${VERSION}" --notes-file release-notes.md
          else
            gh release create "$TAG" "$ZIP" "$ZIP.sha256" --target "$GITHUB_SHA" --title "Kanto Dive ${VERSION}" --notes-file release-notes.md
          fi
          gh release view "$TAG" --json url,tagName,name,assets > release-state.json
          cat release-state.json

      - name: Confirm publication on merged PR
        if: ${{ steps.version.outputs.version == '1.6.1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP='Kanto-Dive-1.6.1-Launcher-Ready.zip'
          URL=$(python3 -c 'import json; print(json.load(open("release-state.json"))["url"])')
          ASSETS=$(python3 -c 'import json; print(", ".join(a["name"] for a in json.load(open("release-state.json"))["assets"]))')
          gh pr comment 5 --body "Release v1.6.1 published successfully. Launcher-ready asset: \`$ZIP\`. Release: $URL. Assets verified by the release workflow: $ASSETS"
