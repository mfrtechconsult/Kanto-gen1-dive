name: Build and publish Kanto Dive release

on:
  push:
    branches:
      - main
    paths:
      - "kanto_dive/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
  issues:
    types:
      - opened
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: kanto-dive-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'issues' || github.event.issue.title == 'release:v1.5.1'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read mod version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("kanto_dive/manifest.json", encoding="utf-8"))["version"])')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build installable ZIP
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="kanto_dive-${VERSION}.zip"
          (
            cd kanto_dive
            zip -r "../$ZIP" . \
              -x "*/__pycache__/*" "*.pyc" "*.pyo" ".DS_Store" "Thumbs.db"
          )
          unzip -Z1 "$ZIP" | grep -qx 'manifest.json'
          unzip -t "$ZIP"
          sha256sum "$ZIP" > "${ZIP}.sha256"

      - name: Prepare release notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > release-notes.md <<EOF
          ## Kanto Dive ${VERSION}

          Kanto Dive adds HM06 DIVE and Emerald-style underwater exploration to Gen1Recomp.

          ### Highlights

          - DIVE zones authored explicitly in Tiled
          - Dark DIVE water visible in 2D, Tilt, and Voxel modes
          - Bidirectional surface/underwater coordinate mapping
          - Surf movement and sprite preserved underwater
          - SURF blocked while already underwater
          - Route 19 Reef Passage with two entrances and an underwater corridor
          - Route 20 Seafloor, Seafoam Sunken Cave, and Route 21 Trench
          - Gen1Recomp Mod Index / launcher-compatible ZIP layout

          ### Installation

          Import `kanto_dive-${VERSION}.zip` directly through the Gen1Recomp launcher. For manual installation, create `Gen1Recomp/mods/kanto_dive/` and extract the ZIP contents directly into that folder so `manifest.json` is at `Gen1Recomp/mods/kanto_dive/manifest.json`.
          EOF

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          ZIP="kanto_dive-${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "${ZIP}.sha256" --clobber
            gh release edit "$TAG" \
              --title "Kanto Dive ${VERSION}" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG" "$ZIP" "${ZIP}.sha256" \
              --target "$GITHUB_SHA" \
              --title "Kanto Dive ${VERSION}" \
              --notes-file release-notes.md \
              --latest
          fi
